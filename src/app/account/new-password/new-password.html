<div
  class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 sm:p-6 font-['Cairo'] transition-colors duration-300"
  dir="rtl"
>
  <div class="w-full max-w-lg relative">
    <div
      class="absolute -top-10 -right-10 w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute -bottom-10 -left-10 w-64 h-64 bg-teal-500/10 rounded-full blur-3xl animate-pulse delay-700"
    ></div>

    <div
      class="bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 dark:shadow-black/50 border border-white/20 dark:border-gray-700 overflow-hidden relative z-10 backdrop-blur-xl"
    >
      <div
        class="bg-gradient-to-b from-emerald-50/50 to-transparent dark:from-gray-700/30 p-8 pb-4 text-center"
      >
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl mb-4 shadow-lg shadow-emerald-500/30"
        >
          <i class="fas fa-key text-white text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">كلمة مرور جديدة</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm">أنشئ كلمة مرور قوية لحماية حسابك</p>
      </div>

      <div class="p-8 pt-4">
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-6 text-right">
          <div class="group">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2 mr-1"
              >كلمة المرور الجديدة</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-emerald-500 transition-colors"
              >
                <i class="fas fa-lock text-lg"></i>
              </div>
              <input
                type="password"
                formControlName="newPassword"
                placeholder="••••••••"
                class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-200 dark:border-gray-600 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all outline-none text-gray-900 dark:text-white placeholder-gray-400 font-medium text-left"
                dir="ltr"
              />
            </div>
            <p class="text-xs text-gray-400 mt-2 mr-2 flex items-center gap-1">
              <i class="fas fa-info-circle"></i> يجب أن تكون 6 أحرف على الأقل.
            </p>
          </div>

          <button
            type="submit"
            [disabled]="passwordForm.invalid"
            class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-2xl shadow-xl shadow-emerald-500/30 hover:shadow-emerald-500/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50"
          >
            تغيير كلمة المرور
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
