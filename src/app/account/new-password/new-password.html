<div
  class="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900"
  dir="rtl"
>
  <div
    class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700"
  >
    <div class="p-8 pb-0 text-center">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl mb-4 shadow-lg shadow-emerald-500/30"
      >
        <i class="fas fa-key text-white text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">تعيين كلمة مرور جديدة</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">يرجى إنشاء كلمة مرور قوية لحسابك.</p>
    </div>

    <div class="p-8">
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-6 text-right">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
            >كلمة المرور الجديدة</label
          >
          <input
            type="password"
            formControlName="newPassword"
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition-all"
          />
          <p class="text-xs text-gray-400 mt-2 flex items-center gap-1">
            <i class="fas fa-info-circle ml-1"></i> يجب أن تكون 6 أحرف على الأقل.
          </p>
        </div>

        <button
          type="submit"
          [disabled]="passwordForm.invalid"
          class="w-full py-3.5 bg-gradient-to-r from-primary-600 to-primary-500 text-white font-bold rounded-xl shadow-lg shadow-primary-500/30 transition-all hover:-translate-y-0.5 disabled:opacity-50"
        >
          تغيير كلمة المرور
        </button>
      </form>
    </div>
  </div>
</div>
