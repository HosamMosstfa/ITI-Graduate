<div
  class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 sm:p-6 font-['Cairo'] transition-colors duration-300"
  dir="rtl"
>
  <div class="w-full max-w-lg relative">
    <div
      class="absolute -top-10 -left-10 w-64 h-64 bg-green-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-64 h-64 bg-primary-500/10 rounded-full blur-3xl animate-pulse delay-700"
    ></div>

    <div
      class="bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 dark:shadow-black/50 border border-white/20 dark:border-gray-700 overflow-hidden relative z-10 backdrop-blur-xl"
    >
      <div
        class="bg-gradient-to-b from-primary-50/50 to-transparent dark:from-gray-700/30 p-8 pb-4 text-center"
      >
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl mb-4 shadow-lg shadow-primary-500/30"
        >
          <i class="fas fa-envelope-open-text text-white text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">تفعيل الحساب</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm">
          أدخل الرمز الذي أرسلناه إلى بريدك الإلكتروني
        </p>
      </div>

      <div class="p-8 pt-4">
        <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="space-y-6 text-right">
          <div class="group">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2 mr-1"
              >البريد الإلكتروني</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400"
              >
                <i class="fas fa-at text-lg"></i>
              </div>
              <input
                type="email"
                formControlName="email"
                readonly
                class="w-full pr-12 pl-4 py-4 bg-gray-100 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-2xl text-gray-500 cursor-not-allowed text-left font-medium"
                dir="ltr"
              />
            </div>
          </div>

          <div class="group">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2 mr-1"
              >رمز التحقق</label
            >
            <input
              type="text"
              formControlName="code"
              placeholder="XXXX"
              class="w-full py-4 text-center text-2xl tracking-[0.5em] font-bold bg-gray-50 dark:bg-gray-700/30 border border-gray-200 dark:border-gray-600 rounded-2xl focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all outline-none text-gray-900 dark:text-white uppercase placeholder-gray-300"
              [class.border-red-300]="
                verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched
              "
            />
            <p
              *ngIf="verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched"
              class="text-red-500 text-xs mt-2 text-center font-medium"
            >
              رمز التحقق مطلوب
            </p>
          </div>

          <button
            type="submit"
            [disabled]="verifyForm.invalid"
            class="w-full py-4 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 text-white font-bold rounded-2xl shadow-xl shadow-primary-500/30 hover:shadow-primary-500/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50"
          >
            تفعيل الحساب
          </button>

          <div class="text-center pt-2">
            <button
              type="button"
              (click)="resendCode()"
              class="text-sm font-bold text-primary-600 hover:text-primary-700 transition-colors flex items-center justify-center gap-2 mx-auto group"
            >
              <i
                class="fas fa-redo text-xs group-hover:rotate-180 transition-transform duration-500"
              ></i>
              لم تستلم الرمز؟ إعادة إرسال
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
