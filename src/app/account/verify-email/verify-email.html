<div
  class="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900"
  dir="rtl"
>
  <div
    class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700"
  >
    <div class="p-8 pb-0 text-center">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl mb-4 shadow-lg shadow-primary-500/30"
      >
        <i class="fas fa-envelope-open-text text-white text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">تفعيل الحساب</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">
        أرسلنا رمزاً إلى بريدك الإلكتروني. أدخله أدناه لتفعيل حسابك.
      </p>
    </div>

    <div class="p-8">
      <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="space-y-5 text-right">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >البريد الإلكتروني</label
          >
          <input
            type="email"
            formControlName="email"
            readonly
            class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-500 rounded-xl cursor-not-allowed text-left"
            dir="ltr"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
            >رمز التحقق</label
          >
          <input
            type="text"
            formControlName="code"
            placeholder="XXXX"
            class="w-full px-4 py-3 text-center text-xl tracking-widest font-bold bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition-all uppercase"
            [class.ring-2]="verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched"
            [class.ring-red-500]="
              verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched
            "
          />
          <p
            *ngIf="verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched"
            class="text-red-500 text-xs mt-1 text-center"
          >
            رمز التحقق مطلوب.
          </p>
        </div>

        <button
          type="submit"
          [disabled]="verifyForm.invalid"
          class="w-full py-3.5 bg-gradient-to-r from-primary-600 to-primary-500 text-white font-bold rounded-xl shadow-lg shadow-primary-500/30 transition-all hover:-translate-y-0.5 disabled:opacity-50"
        >
          تفعيل الحساب
        </button>

        <div class="text-center pt-2">
          <button
            type="button"
            (click)="resendCode()"
            class="text-sm text-primary-600 hover:text-primary-700 font-medium transition-colors"
          >
            لم تستلم الرمز؟ إعادة إرسال
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
