<div class="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900">
  <div
    class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700"
  >
    <div class="p-8 pb-0 text-center">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl mb-4 shadow-lg shadow-primary-500/30"
      >
        <i class="fas fa-leaf text-white text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Welcome Back</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Login to continue to NutriGuide</p>
    </div>

    <div class="p-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
            >Email Address</label
          >
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input
              type="email"
              formControlName="email"
              placeholder="name@example.com"
              class="w-full pr-11 pl-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none"
              [class.ring-2]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              [class.ring-red-500]="
                loginForm.get('email')?.invalid && loginForm.get('email')?.touched
              "
            />
          </div>
          <p
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            class="text-red-500 text-xs mt-1"
          >
            Please enter a valid email address.
          </p>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Password</label
            >
            <a
              routerLink="/forgot-password"
              class="text-sm text-primary-600 hover:text-primary-700 font-medium transition-colors"
              >?Forgot Password</a
            >
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full pr-11 pl-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none"
              [class.ring-2]="
                loginForm.get('password')?.invalid && loginForm.get('password')?.touched
              "
              [class.ring-red-500]="
                loginForm.get('password')?.invalid && loginForm.get('password')?.touched
              "
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full py-3.5 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 text-white font-bold rounded-xl shadow-lg shadow-primary-500/30 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Sign In
        </button>

        <div class="text-center mt-6">
          <p class="text-sm text-gray-500 dark:text-gray-400">
            Don't have an account?
            <a
              routerLink="/register"
              class="text-primary-600 hover:text-primary-700 font-bold transition-colors"
              >Register for free</a
            >
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
