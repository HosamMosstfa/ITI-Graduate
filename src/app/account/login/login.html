<div
  class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 sm:p-6 font-['Cairo'] transition-colors duration-300"
  dir="rtl"
>
  <div class="w-full max-w-lg relative">
    <div
      class="absolute -top-10 -left-10 w-64 h-64 bg-primary-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-64 h-64 bg-orange-500/10 rounded-full blur-3xl animate-pulse delay-700"
    ></div>

    <div
      class="bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 dark:shadow-black/50 border border-white/20 dark:border-gray-700 overflow-hidden relative z-10 backdrop-blur-xl"
    >
      <div
        class="bg-gradient-to-b from-primary-50/50 to-transparent dark:from-gray-700/30 p-8 pb-4 text-center"
      >
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl mb-4 shadow-lg shadow-primary-500/30"
        >
          <i class="fas fa-leaf text-white text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">أهلاً بك مجدداً</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm">سجل دخولك للمتابعة إلى NutriGuide</p>
      </div>

      <div class="p-8 pt-4">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6 text-right">
          <div class="group">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2 mr-1"
              >البريد الإلكتروني</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors"
              >
                <i class="fas fa-envelope text-lg"></i>
              </div>
              <input
                type="email"
                formControlName="email"
                placeholder="name@example.com"
                class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-200 dark:border-gray-600 rounded-2xl focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all outline-none text-gray-900 dark:text-white placeholder-gray-400 font-medium text-left"
                dir="ltr"
                [class.border-red-300]="
                  loginForm.get('email')?.invalid && loginForm.get('email')?.touched
                "
              />
            </div>
            <p
              *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              class="text-red-500 text-xs mt-2 mr-2 font-medium"
            >
              يرجى إدخال بريد إلكتروني صحيح.
            </p>
          </div>

          <div class="group">
            <div class="flex items-center justify-between mb-2">
              <label
                class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mr-1"
                >كلمة المرور</label
              >
              <a
                routerLink="/forgot-password"
                class="text-xs font-bold text-primary-600 hover:text-primary-700 transition-colors"
                >نسيت كلمة المرور؟</a
              >
            </div>
            <div class="relative">
              <div
                class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors"
              >
                <i class="fas fa-lock text-lg"></i>
              </div>
              <input
                type="password"
                formControlName="password"
                placeholder="••••••••"
                class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-200 dark:border-gray-600 rounded-2xl focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all outline-none text-gray-900 dark:text-white placeholder-gray-400 font-medium text-left"
                dir="ltr"
              />
            </div>
          </div>

          <button
            type="submit"
            [disabled]="loginForm.invalid"
            class="w-full py-4 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 text-white font-bold rounded-2xl shadow-xl shadow-primary-500/30 hover:shadow-primary-500/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
          >
            تسجيل الدخول
          </button>

          <div class="text-center mt-6">
            <p class="text-sm text-gray-500 dark:text-gray-400">
              ليس لديك حساب؟
              <a
                routerLink="/register"
                class="text-primary-600 hover:text-primary-700 font-bold transition-colors"
                >سجل مجاناً</a
              >
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
