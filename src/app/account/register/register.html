<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 font-['Cairo'] relative overflow-hidden" dir="rtl">

  <div class="absolute top-0 right-0 w-96 h-96 bg-primary-500/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>

  <div class="w-full max-w-5xl bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 dark:shadow-black/50 overflow-hidden flex flex-col md:flex-row relative z-10 border border-white/20 dark:border-gray-700">

    <div class="hidden md:flex md:w-5/12 bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 text-white p-12 flex-col justify-between relative overflow-hidden">

      <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
      <div class="absolute -top-24 -left-24 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
      <div class="absolute bottom-12 right-12 w-32 h-32 bg-primary-400/20 rounded-full blur-2xl"></div>

      <div class="relative z-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl mb-6 shadow-inner border border-white/20">
          <i class="fas fa-leaf text-3xl text-primary-200"></i>
        </div>
        <h2 class="text-4xl font-bold mb-4 leading-tight">ابدأ رحلة<br/>صحتك اليوم</h2>
        <p class="text-primary-100 text-lg leading-relaxed opacity-90">
          انضم إلى مجتمع NutriGuide واحصل على خطط غذائية مخصصة تناسب أسلوب حياتك.
        </p>
      </div>

      <div class="relative z-10 text-sm text-primary-200/60 font-medium">
        &copy; 2025 NutriGuide. جميع الحقوق محفوظة.
      </div>
    </div>

    <div class="w-full md:w-7/12 p-8 md:p-12 bg-white dark:bg-gray-800">

      <div class="text-right mb-8">
        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">إنشاء حساب جديد</h3>
        <p class="text-gray-500 dark:text-gray-400 text-sm">املأ البيانات التالية للتسجيل في المنصة</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5 text-right">

        <div class="group">
          <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 mr-1 uppercase tracking-wide">الاسم الكامل</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors duration-300">
              <i class="fas fa-user text-lg"></i>
            </div>
            <input
              type="text"
              formControlName="name"
              placeholder="الاسم الثلاثي"
              class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-100 dark:border-gray-600 rounded-2xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all duration-300 outline-none font-medium"
            />
          </div>
        </div>

        <div class="group">
          <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 mr-1 uppercase tracking-wide">البريد الإلكتروني</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors duration-300">
              <i class="fas fa-envelope text-lg"></i>
            </div>
            <input
              type="email"
              formControlName="email"
              placeholder="name@example.com"
              dir="ltr"
              class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-100 dark:border-gray-600 rounded-2xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all duration-300 outline-none font-medium text-left"
            />
          </div>
        </div>

        <div class="group">
          <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 mr-1 uppercase tracking-wide">رقم الهاتف</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors duration-300">
              <i class="fas fa-phone text-lg"></i>
            </div>
            <input
              type="tel"
              formControlName="phone"
              placeholder="01xxxxxxxxx"
              dir="ltr"
              class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-100 dark:border-gray-600 rounded-2xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all duration-300 outline-none font-medium text-left"
            />
          </div>
        </div>

        <div class="group">
          <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 mr-1 uppercase tracking-wide">كلمة المرور</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary-500 transition-colors duration-300">
              <i class="fas fa-lock text-lg"></i>
            </div>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              dir="ltr"
              class="w-full pr-12 pl-4 py-4 bg-gray-50 dark:bg-gray-700/30 border border-gray-100 dark:border-gray-600 rounded-2xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all duration-300 outline-none font-medium text-left"
            />
          </div>
          <p class="text-[13px] text-gray-400 mt-2 mr-1 flex items-center gap-1">
            <i class="fas fa-info-circle"></i> حرف كبير ، رقم ، وحرف خاص.
          </p>
        </div>

        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full py-4 mt-2 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 text-white font-bold rounded-2xl shadow-xl shadow-primary-500/20 hover:shadow-primary-500/40 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        >
          تسجيل حساب جديد
        </button>

        <div class="text-center mt-6 pt-4 border-t border-gray-50 dark:border-gray-700/50">
          <p class="text-sm text-gray-500 dark:text-gray-400">
            لديك حساب بالفعل؟
            <a routerLink="/login" class="text-primary-600 hover:text-primary-700 font-bold transition-colors mr-1">تسجيل الدخول</a>
          </p>
        </div>

      </form>
    </div>
  </div>
</div>
