<div
  class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 sm:p-6 font-['Cairo'] transition-colors duration-300"
  dir="rtl"
>
  <div class="w-full max-w-lg relative">
    <div
      class="absolute -top-10 -left-10 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute -bottom-10 -right-10 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl animate-pulse delay-700"
    ></div>

    <div
      class="bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 dark:shadow-black/50 border border-white/20 dark:border-gray-700 overflow-hidden relative z-10 backdrop-blur-xl"
    >
      <div class="p-8 pb-4 text-center">
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-4 shadow-lg shadow-purple-500/30"
        >
          <i class="fas fa-shield-alt text-white text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">التحقق من الرمز</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm">
          أدخل الرمز المرسل إلى <span class="font-bold text-indigo-500" dir="ltr">{{ email }}</span>
        </p>
      </div>

      <div class="p-8 pt-4">
        <form [formGroup]="codeForm" (ngSubmit)="onSubmit()" class="space-y-6 text-right">
          <div class="group">
            <label
              class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2 mr-1"
              >رمز التحقق</label
            >
            <input
              type="text"
              formControlName="code"
              placeholder="XXXX"
              class="w-full py-4 text-center text-2xl tracking-[0.5em] font-bold bg-gray-50 dark:bg-gray-700/30 border border-gray-200 dark:border-gray-600 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all outline-none text-gray-900 dark:text-white uppercase placeholder-gray-300"
            />
          </div>

          <button
            type="submit"
            [disabled]="codeForm.invalid"
            class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-xl shadow-purple-500/30 hover:shadow-purple-500/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50"
          >
            تأكيد الرمز
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
